<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wax&Wire | Contact</title>
    <link rel="stylesheet" href="public/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>

    <nav id="navbar-container"></nav>
    
    <main>

        <section class="container py-5">

    <header class="mb-4 text-center">
        <h1>Contact Us</h1>
        <p>Have a question or request? Send us a message and we’ll get back to you soon.</p>
    </header>

    <form action="#" method="post">

        <section class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input 
                type="text" 
                id="name" 
                name="name" 
                class="form-control" 
                placeholder="Enter your name" 
                required>
        </section>

        <section class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                class="form-control" 
                placeholder="Enter your email" 
                required>
        </section>

        <section class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <input 
                type="text" 
                id="subject" 
                name="subject" 
                class="form-control" 
                placeholder="What is this about?">
        </section>

        <section class="mb-4">
            <label for="message" class="form-label">Message</label>
            <textarea 
                id="message" 
                name="message" 
                class="form-control" 
                rows="5" 
                placeholder="Write your message here..." 
                required></textarea>
        </section>

        <section class="text-center">
            <button type="submit" class="btn btn-primary px-4">Send Message</button>
        </section>

    </form>

</section>
    </main>

    <footer id="footer-container"></footer>
    
    <script type="module" src="public/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
